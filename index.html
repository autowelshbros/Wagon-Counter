<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Order Tracker</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="app-header">
  <h1>Order Tracker</h1>
  <span id="build-version" class="build-version">Build: v1.7</span>
  <button id="check-updates-btn" class="btn btn-secondary btn-check-updates" type="button">&#8635; Check for updates</button>
  <button id="new-order-btn" class="btn btn-primary">+ New Order</button>
</header>

<div class="toolbar">
  <div class="field-group">
    <label for="status-filter">Status</label>
    <select id="status-filter">
      <option value="ACTIVE" selected>Active (Open + Packed)</option>
      <option value="ALL">All</option>
      <option value="OPEN">Open</option>
      <option value="PACKED">Packed</option>
      <option value="SHIPPED">Shipped</option>
    </select>
  </div>

  <div class="field-group">
    <label for="date-field-select">Group by</label>
    <select id="date-field-select">
      <option value="pack_by_date" selected>Pack date</option>
      <option value="ship_date">Ship date</option>
    </select>
  </div>

  <div class="field-group">
    <label for="sort-order">Sort</label>
    <select id="sort-order">
      <option value="asc">Soonest first</option>
      <option value="desc">Latest first</option>
    </select>
  </div>

  <div class="field-group">
    <label for="day-filter">Day</label>
    <div class="day-filter-row">
      <input type="date" id="day-filter">
      <button type="button" id="clear-day-filter-btn" class="btn btn-secondary" hidden>All days</button>
    </div>
  </div>

  <div class="field-group flag-filter-group">
    <label class="checkbox-label">
      <input type="checkbox" id="flagged-only">
      Flagged only
    </label>
  </div>
</div>

<main id="order-list" class="order-list" aria-live="polite"></main>

<p id="empty-state" class="empty-state" hidden>No orders match these filters.</p>
<p id="loading-state" class="empty-state">Loading orders&hellip;</p>

<dialog id="order-modal" class="order-modal">
  <form id="order-form" method="dialog">
    <h2 id="modal-title">New Order</h2>

    <div class="field-group">
      <label for="customer-select">Customer</label>
      <select id="customer-select" required>
        <option value="" disabled selected>Select customer&hellip;</option>
        <option value="__new__">+ Add new customer&hellip;</option>
      </select>
      <input type="text" id="new-customer-input" placeholder="New customer name" hidden>
    </div>

    <div class="field-group">
      <label>Product lines</label>
      <div id="order-lines-container"></div>
      <button type="button" id="add-line-btn" class="btn btn-secondary">+ Add product line</button>
    </div>

    <div class="field-group">
      <label for="ship-date-input">Ship date &amp; time</label>
      <input type="datetime-local" id="ship-date-input" required>
    </div>

    <div class="field-group">
      <label for="pack-by-date-input">Pack by date &amp; time</label>
      <input type="datetime-local" id="pack-by-date-input" required>
    </div>

    <div class="field-group">
      <label for="destination-input">Destination</label>
      <input type="text" id="destination-input">
    </div>

    <div class="field-group">
      <label for="po-number-input">PO number</label>
      <input type="text" id="po-number-input">
    </div>

    <div class="field-group">
      <label for="pickup-location-select">Pickup location</label>
      <select id="pickup-location-select">
        <option value="" selected>Not set</option>
        <option value="Market">Market</option>
        <option value="Home">Home</option>
        <option value="Delivery">Delivery</option>
      </select>
    </div>

    <div class="field-group">
      <label for="notes-input">Notes</label>
      <textarea id="notes-input" rows="3"></textarea>
    </div>

    <div class="field-group">
      <label for="created-by-input">Your name</label>
      <input type="text" id="created-by-input" required>
    </div>

    <p id="form-error" class="form-error" hidden></p>

    <div class="modal-actions">
      <button type="button" id="cancel-order-btn" class="btn btn-secondary">Cancel</button>
      <button type="submit" id="save-order-btn" class="btn btn-primary">Save Order</button>
    </div>
  </form>
</dialog>

<template id="order-line-template">
  <div class="order-line">
    <div class="line-fields">
      <div class="field-group">
        <label>Product</label>
        <select class="line-product" required>
          <option value="" disabled selected>Select product&hellip;</option>
        </select>
      </div>

      <div class="field-group">
        <label>Pack method</label>
        <select class="line-pack-method" required>
          <option value="" disabled selected>Select pack method&hellip;</option>
          <option value="Skid">Skid</option>
          <option value="Rack">Rack</option>
          <option value="Bin">Bin</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label>
            <span class="line-units-label">Units per pack</span>
            <span class="line-units-hint hint"></span>
          </label>
          <input type="number" class="line-units" min="0" required>
        </div>

        <div class="field-group">
          <label>Quantity</label>
          <input type="number" class="line-quantity" min="1" required>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-secondary remove-line-btn">Remove line</button>
  </div>
</template>

<template id="order-card-template">
  <article class="order-card">
    <div class="order-card-header">
      <h3 class="order-customer"></h3>
      <span class="status-badge"></span>
    </div>
    <ul class="order-lines"></ul>
    <p class="order-ship-date"></p>
    <p class="order-pack-by-date"></p>
    <p class="order-destination"></p>
    <p class="order-po-number"></p>
    <p class="order-pickup-location"></p>
    <p class="order-notes"></p>
    <p class="order-meta"></p>
    <div class="order-actions"></div>
  </article>
</template>

<template id="order-line-display-template">
  <li class="order-line-display">
    <span class="line-summary"></span>
    <span class="flag-badge" hidden title="Non-standard units per pack">&#9888; Non-standard</span>
  </li>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
